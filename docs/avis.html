<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Relecture avant Tabatha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding-bottom: 96px; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px; }
    h1 { font-family: var(--serif); font-size: 1.6rem; margin: 0 0 6px; }
    .intro { color: var(--muted); margin: 0 0 18px; line-height: 1.45; }
    .item { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
    .item[data-v="ok"] { border-color: var(--good); }
    .item[data-v="bof"] { border-color: var(--mid); }
    .item[data-v="non"] { border-color: var(--accent); opacity: .92; }
    .tete { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .prix { font-family: var(--serif); font-size: 1.5rem; font-weight: 600; }
    .src { font-size: .78rem; background: var(--chip); border-radius: 999px; padding: 2px 9px; color: var(--muted); white-space: nowrap; }
    .meta { color: var(--muted); margin: 2px 0 4px; }
    .titre { font-weight: 500; margin: 0 0 6px; }
    .hint { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 6px 10px; font-size: .85rem; margin: 6px 0; }
    .lien { display: inline-block; margin: 2px 0 10px; color: var(--accent); font-weight: 600; text-decoration: none; }
    .verdicts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .verdicts button { padding: 12px 6px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); font: inherit; font-weight: 600; cursor: pointer; }
    .verdicts button[aria-pressed="true"][data-v="ok"] { background: var(--good); color: #fff; border-color: var(--good); }
    .verdicts button[aria-pressed="true"][data-v="bof"] { background: var(--mid); color: #fff; border-color: var(--mid); }
    .verdicts button[aria-pressed="true"][data-v="non"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .raisons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .raisons button, .manque button { border: 1.5px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 11px; font: inherit; font-size: .88rem; cursor: pointer; }
    .raisons button[aria-pressed="true"], .manque button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    textarea, input.com { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 9px 11px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
    .bloc { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 18px 0; }
    .bloc h2 { font-family: var(--serif); font-size: 1.15rem; margin: 0 0 8px; }
    .manque { display: flex; flex-wrap: wrap; gap: 6px; }
    .barre { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .barre .prog { color: var(--muted); font-size: .9rem; }
    .etat { margin: 8px 0 0; font-size: .9rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🤎 Relecture avant Tabatha</h1>
    <p class="intro" id="intro">Chargement…</p>
    <div id="liste"></div>

    <div class="bloc">
      <h2>Pour améliorer l'appli</h2>
      <p class="intro" style="margin-bottom:8px">Qu'est-ce qui t'aurait le plus aidé pour trier plus vite ?</p>
      <div class="manque" id="manque"></div>
      <textarea id="remarque" rows="3" placeholder="Autre chose à améliorer ? (facultatif)"></textarea>
    </div>
    <p class="etat" id="etat"></p>
  </div>

  <div class="barre">
    <span class="prog" id="prog"></span>
    <span>
      <button class="btn ghost small" id="copier" type="button">Copier</button>
      <button class="btn primary" id="envoyer" type="button">Envoyer à Claude</button>
    </span>
  </div>
  <script type="module" src="avis.js?v=1"></script>
</body>
</html>
